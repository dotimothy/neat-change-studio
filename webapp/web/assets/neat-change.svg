<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Neat Change Studio: a before photo and an after photo, with a new object boxed in the after one, and the Neat sparkle. -->
  <defs>
    <linearGradient id="spectrum" gradientUnits="userSpaceOnUse" x1="76" y1="96" x2="222" y2="212">
      <stop offset="0" stop-color="#16c8a6"/><stop offset=".28" stop-color="#4bb54a"/><stop offset=".52" stop-color="#a9c81c"/>
      <stop offset=".76" stop-color="#3a86ec"/><stop offset="1" stop-color="#f2801d"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a222c"/><stop offset="1" stop-color="#0c1016"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18212c"/><stop offset="1" stop-color="#10161e"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#tile)" stroke="#2b3541" stroke-width="2"/>
  <!-- before: a muted, dashed frame behind -->
  <rect x="34" y="58" width="130" height="102" rx="18" fill="none" stroke="#7a8696" stroke-width="8" stroke-dasharray="16 12" stroke-linecap="round"/>
  <!-- after: the frame in front, outlined in the palette -->
  <rect x="76" y="96" width="146" height="116" rx="20" fill="url(#glass)" stroke="url(#spectrum)" stroke-width="10"/>
  <!-- what appeared: a small object, boxed by detection corners -->
  <rect x="131" y="136" width="36" height="36" rx="9" fill="#f4f6f8"/>
  <g fill="none" stroke="#f4f6f8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M113 133 v-14 h14"/><path d="M171 119 h14 v14"/><path d="M185 175 v14 h-14"/><path d="M127 189 h-14 v-14"/>
  </g>
  <!-- the Neat sparkle -->
  <g transform="translate(200 56) scale(.92)">
    <path d="M0 -34 L7 -7 L0 0 L-7 -7 Z" fill="#16c8a6"/>
    <path d="M34 0 L7 7 L0 0 L7 -7 Z" fill="#a9c81c"/>
    <path d="M0 34 L-7 7 L0 0 L7 7 Z" fill="#f2801d"/>
    <path d="M-34 0 L-7 -7 L0 0 L-7 7 Z" fill="#3a86ec"/>
    <circle r="4.5" fill="#0c1016"/>
  </g>
</svg>
